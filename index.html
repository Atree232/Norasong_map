EX13,生まれる前の自動作詞機,地球から遠隔で 教えてみたの

160,刀匠素体伝説,８年も前の 汎用の板で あったこと

999,のら！ちゃん！べりべりきゅーと！,おはきゃーーーーーーっと！！！！`;





// const categoryKeys = ["宇宙","月面","地球","上層","中層","下層","廃棄地域","現実","仮想","概念","ＡＩ","生命論","ＩＭＲ","妖精","のらきゃっと","ますきゃっと（一般）","ますきゃっと（特殊）","異形","ねずみさん","政治","科学","戦闘","食","写真","アイドル","奏演者","第一義体","ネモフィラ","懐古","祈り","お砂糖","恋","インターネット","VRChat","配信","のらべり","学園","ユーザーイベント","イベント","EXMass"];

const categoryKeys = ["宇宙","月面","地球","上層","中層","下層","廃棄地域","現実","バーチャル","概念","ＡＩ","生命論","ＩＭＲ","妖精orティンカーベル","のらきゃっと","ますきゃっと（一般）notますきゃユーザー","ますきゃっと（特殊）orますきゃユーザー","異形or超ノ級","ねずみさん","政治","科学","戦闘","食","写真or撮影orカメラ","アイドルorアイドルますきゃ","奏演者orAtree","第一義体","ネモフィラ","懐古","祈り","お砂糖or恋","インターネット","VRChat","配信","のらべり","学園","ユーザーイベント","クラシックアレンジ","創作物or創作論orｎ次創作","EXMass"];

const width = window.innerWidth - 350;
const height = window.innerHeight;
const themesData = d3.csvParse(themesCSV);
const edgesData = d3.csvParse(edgesCSV);
const descData = d3.csvParse(descCSV);   // のらきゃソング_Desc_gemini.csv の内容
const lyricData = d3.csvParse(lyricCSV); // のらきゃソング_Lyric_gemini.csv の内容

// 検索しやすいように ID をキーにした辞書を作る
const descMap = Object.fromEntries(descData.map(d => [d.番号, d.概要]));
const lyricMap = Object.fromEntries(lyricData.map(d => [d.番号, d.歌いだし]));

const outerRadius = Math.min(width, height) * 0.42;
const centerX = width / 2;
const centerY = height / 2;

const nodes = [];
const allLinks = [];
const activeCategories = new Set();
const categoryColorMap = {};

// 1. カテゴリノード準備
categoryKeys.forEach((cat, i) => {
    const hue = (i * 360 / categoryKeys.length);
    categoryColorMap[cat] = d3.hsl(hue, 0.7, 0.5);
    const angle = (i * 2 * Math.PI) / categoryKeys.length;
    nodes.push({ 
        id: cat, name: cat, type: 'category', hue: hue,
        fx: centerX + outerRadius * Math.cos(angle),
        fy: centerY + outerRadius * Math.sin(angle),
        color: categoryColorMap[cat],
        desc: `${cat}属性を持つ楽曲のハブです。`
    });
});

// 2. 楽曲ノード準備（HSV加重平均）
themesData.forEach(d => {
    let sinSum = 0, cosSum = 0, weightSum = 0, maxS = 0;
    categoryKeys.forEach(cat => {
        const score = +d[cat] || 0;
        if (score >= 5) {
            const rad = (categoryKeys.indexOf(cat) * 360 / categoryKeys.length) * Math.PI / 180;
            sinSum += Math.sin(rad) * score; cosSum += Math.cos(rad) * score;
            weightSum += score; if (score > maxS) maxS = score;
            allLinks.push({ source: cat, target: d.番号, value: score, type: 'cat-link' });
        }
    });

    let avgHue = weightSum > 0 ? (Math.atan2(sinSum, cosSum) * 180 / Math.PI) : 0;
    if (avgHue < 0) avgHue += 360;

    nodes.push({ 
        id: d.番号, 
        name: d.曲名, 
        type: 'song', 
        color: d3.hsl(avgHue, 0.4 + (maxS / 10) * 0.4, 0.6),
        x: centerX + (Math.random()-0.5)*100, 
        y: centerY + (Math.random()-0.5)*100,
        // ここを修正！辞書から取得し、なければデフォルト値を出す
        desc: descMap[d.番号] || "概要データがありません。", 
        lyrics: lyricMap[d.番号] || "歌詞データがありません。"
    });
});

edgesData.forEach(d => {
    if(d.Source && d.Target) {
        allLinks.push({ 
            source: d.Source, 
            target: d.Target, 
            value: +d.Weight, 
            type: d.Type || 'song-link' // ここを変更
        });
    }
});

// --- D3 セットアップ ---
const zoom = d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => container.attr("transform", e.transform));
const svg = d3.select("#graph").call(zoom);
const container = svg.append("g");

const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink().id(d => d.id))
    .force("charge", d3.forceManyBody().strength(d => d.type === 'category' ? -1500 : -120))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collision", d3.forceCollide().radius(d => (d.type === 'category' ? 45 : 22)));

let linkElements = container.append("g").selectAll("line");
let nodeElements = container.append("g").selectAll("circle");
let labelElements = container.append("g").selectAll(".id-label");
let nameElements = container.append("g").selectAll(".name-label");

// --- 機能：カメラパン & 詳細表示 ---
function focusNode(nodeId) {
    const target = nodes.find(n => n.id == nodeId);
    if (!target) return;
    const scale = target.type === 'category' ? 1.2 : 2.5;
    svg.transition().duration(1000).call(
        zoom.transform,
        d3.zoomIdentity.translate(width / 2, height / 2).scale(scale).translate(-target.x, -target.y)
    );
    showDetail(target);
}

function showDetail(d) {
    const sidebar = d3.select("#detail-view").html("");
    const header = sidebar.append("div").attr("class", "detail-header");
    header.append("div").attr("class", "detail-id").text(d.type === 'song' ? `楽曲 ID: ${d.id}` : "テーマ - THEME NODE");
    header.append("div").attr("class", "detail-title").text(d.name).style("color", d.color);

    sidebar.append("div").attr("class", "section-label").text("概要 - Description");
    sidebar.append("div").attr("class", "detail-text").text(d.desc);

    if (d.type === 'song') {
        sidebar.append("div").attr("class", "section-label").text("歌いだし - Lyrics / Intro");
        sidebar.append("div")
            .attr("class", "detail-text")
            .style("font-style", "italic")
            .style("border-left", "2px solid #555")
            .style("padding-left", "10px")
            .text(`“ ${d.lyrics} ”`);
    }

    // --- ここからグループ分け表示の処理 ---

    // 1. このノードに関係するすべてのリンクを取得
    const connections = allLinks.filter(l => (l.source.id || l.source) === d.id || (l.target.id || l.target) === d.id);

    // 重複を除いて件数を数えるヘルパー関数
    const getUniqueCount = (type) => {
        const uniqueIds = new Set();
        connections.filter(l => l.type === type).forEach(l => {
            // 自分じゃない方のIDをSetに追加
            const sourceId = l.source.id || l.source;
            const targetId = l.target.id || l.target;
            uniqueIds.add(sourceId === d.id ? targetId : sourceId);
        });
        return uniqueIds.size;
    };

    // 2. 表示したいグループの定義
    const groupDef = [
        { 
            type: 'cat-link', 
            label: (d.type === 'song' ? "所属テーマ" : "所属楽曲") + `：${getUniqueCount('cat-link')}`, 
            icon: d.type === 'category' ? '🎵' : '🏷️' 
        },
        { 
            type: 'melody',  
            label: `引用曲（メロディ）：${getUniqueCount('melody')}`, 
            icon: '🎵' 
        },
        { 
            type: 'context', 
            label: `関連曲（文脈）：${getUniqueCount('context')}`, 
            icon: '🔗' 
        }
    ];

    // 3. 各グループごとにリストを作成
    groupDef.forEach(group => {
        const groupLinks = connections.filter(l => l.type === group.type);

        if (groupLinks.length > 0) {
            sidebar.append("div").attr("class", "section-label").text(group.label);
            const list = sidebar.append("ul").attr("class", "node-list");

            // --- データの整理（重複排除と ID順ソート） ---
            const processedNodes = groupLinks.map(l => {
                const sId = l.source.id || l.source;
                const tId = l.target.id || l.target;
                const isOutgoing = (sId === d.id);
                const partnerId = isOutgoing ? tId : sId;
                const partnerNode = nodes.find(node => node.id == partnerId);
                return { node: partnerNode, isOutgoing: isOutgoing };
            })
            .filter(item => item.node)
            .filter((v, i, a) => a.findIndex(t => t.node.id === v.node.id) === i)
            // ★ここを ID順（数値昇順）に変更
            .sort((a, b) => {
                return Number(a.node.id) - Number(b.node.id);
            });

            // --- リストの描画 ---
            processedNodes.forEach(item => {
                const n = item.node;
                let itemText = n.name;
                
                if (group.type === 'melody') {
                    itemText = item.isOutgoing ? `↗️ 引用: ${n.name}` : `↙️ 被引用: ${n.name}`;
                } else if (group.type === 'context') {
                    itemText = `🔗 ${n.name}`;
                } else {
                    // テーマノード選択時はここが実行され、おんぷ（🎵）とともに名前が表示される
                    itemText = `${group.icon} ${n.name}`;
                }

                list.append("li")
                    .attr("class", "node-item")
                    .style("cursor", "pointer")
                    .text(itemText)
                    .on("click", () => focusNode(n.id));
            });
        }
    });
}

// --- メイン：グラフ更新ロジック ---
function updateGraph() {
    // アクティブなカテゴリに基づくリンクのフィルタリング
// 1. リンクのフィルタリング
    const currentLinks = allLinks.filter(l => {
        // 曲同士のリンク（melody や context）は常に表示する
        if (l.type === 'melody' || l.type === 'context') {
            return true;
        }

        // カテゴリ（テーマ）とのリンクは、チェックが入っているものだけ表示
        const sId = l.source.id || l.source;
        const tId = l.target.id || l.target;
        return activeCategories.has(sId) || activeCategories.has(tId);
    });

     // エッジ更新
    linkElements = linkElements.data(currentLinks, d => (d.source.id||d.source) + "-" + (d.target.id||d.target))
        .join("line")
        .attr("stroke", d => {
            if (d.type === 'cat-link') return (d.source.color || "#777");
            if (d.type === 'melody') return "#ffffff"; // 引用（メロディ）は「白線」
            if (d.type === 'context') return "#666666"; // 関連（文脈）はグレー
            return "#555";
        })
        .attr("stroke-dasharray", d => {
            if (d.type === 'context') return "10,3"; // 関連曲は「点線」にする（10px描いて3px空ける）
            return "none"; // それ以外（引用やカテゴリ）は実線
        })
        .attr("stroke-opacity", d => {
            if (d.type === 'melody') return 0.05;  // 引用はハッキリ
            if (d.type === 'context') return 0.03; // 関連は薄いまま
            return 0.2;
        })
        .attr("stroke-width", d => {
            if (d.type === 'melody') return 2;  // 引用は少し太く
            if (d.type === 'context') return 1.5; // 関連は細く
            return Math.sqrt(d.value || 1);
        });

    // ノード更新
    nodeElements = nodeElements.data(nodes, d => d.id)
        .join("circle")
        .attr("r", d => d.type === 'category' ? 32 : 11)
        .attr("fill", d => d.color)
        .attr("stroke", d => activeCategories.has(d.id) ? "#fff" : "none")
        .attr("stroke-width", 3)
        .attr("opacity", d => (d.type === 'song' || activeCategories.has(d.id)) ? 1 : 0.2)
        .style("cursor", "pointer")
        .on("click", (event, d) => {
            focusNode(d.id);
            if (d.type === 'category') {
                // テーマクリックで引力とエッジをトグル
                activeCategories.has(d.id) ? activeCategories.delete(d.id) : activeCategories.add(d.id);
                updateGraph();
            }
            event.stopPropagation();
        })
        .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended));

    // 中央ラベル（テーマ名 or 曲ID）
    labelElements = labelElements.data(nodes, d => d.id)
        .join("text")
        .attr("class", "id-label")
        .text(d => d.type === 'song' ? d.id : d.name)
        .attr("fill", "#fff")
        .attr("font-size", d => d.type === 'category' ? "14px" : "9px")
        .attr("font-weight", "bold")
        .attr("pointer-events", "none")
        .attr("text-anchor", "middle")
        .attr("dy", d => d.type === 'category' ? 5 : 4)
        .attr("opacity", d => (d.type === 'song' || activeCategories.has(d.id)) ? 1 : 0.3);

    // 下部ラベル（曲名のみ）
    nameElements = nameElements.data(nodes.filter(d => d.type === 'song'), d => d.id)
        .join("text")
        .attr("class", "name-label")
        .text(d => d.name)
        .attr("fill", "#eee")
        .attr("font-size", "9px")
        .attr("pointer-events", "none")
        .attr("text-anchor", "middle")
        .attr("dy", 26) 
        .attr("opacity", d => {
            const isConnected = allLinks.some(l => 
                (l.target.id || l.target) === d.id && activeCategories.has(l.source.id || l.source)
            );
            return isConnected ? 1 : 0.4;
        });

    simulation.nodes(nodes);
    simulation.force("link").links(currentLinks)
        .distance(d => {
            if (d.type === 'cat-link') return (350 - d.value * 28);
            if (d.type === 'melody') return 50;  // 引用は近くに配置
            if (d.type === 'context') return 150; // 関連は遠くてもOKにする
            return 60;
        })
        .strength(d => {
            if (d.type === 'cat-link') return (d.value / 10) * 1.0;
            if (d.type === 'melody') return 0.2;   // 引用はある程度引き寄せる
            if (d.type === 'context') return 0.01/2; // ★関連はほとんど引力を働かせない
            return 0.05;
        });
    
    simulation.alpha(0.3).restart();
}

function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); if (d.type === 'song') { d.fx = null; d.fy = null; } }

simulation.on("tick", () => {
    linkElements.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodeElements.attr("cx", d => d.x).attr("cy", d => d.y);
    labelElements.attr("x", d => d.x).attr("y", d => d.y);
    nameElements.attr("x", d => d.x).attr("y", d => d.y);
});

updateGraph();
</script>
